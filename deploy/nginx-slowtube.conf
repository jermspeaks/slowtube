# Copy to /etc/nginx/sites-available/slowtube and symlink sites-enabled.
# Adjust server_name, ssl_certificate paths, and root to your deploy paths.
#
# Upstream: Slowtube API (default PORT=6001). Set HOST_BIND=127.0.0.1 in backend/.env
# so the API is only reachable via nginx.

upstream slowtube_api {
    server 127.0.0.1:6001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name slowtube.example.com;

    # After certbot, redirect HTTP → HTTPS and duplicate this block for 443 + ssl.
    # return 301 https://$host$request_uri;

    root /opt/slowtube/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://slowtube_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Optional: health through nginx (same as hitting backend /health)
    location = /health {
        proxy_pass http://slowtube_api;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/slowtube.access.log;
    error_log  /var/log/nginx/slowtube.error.log;
}
